      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-pure);
    }
    .brand img {

      font-size: 14px;
      padding: 6px 12px;

    .nav-links a:hover {

      background: rgba(255, 255, 255, 0.1);
    }

      min-height: 100vh;

      border-bottom: 1px solid var(--border-card);

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }
    .hero-info h1 {
      font-family: var(--font-song);

      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-pure);
      margin-bottom: 16px;
    }
    .hero-info .subtitle {
      font-size: 16px;
      color: var(--leaf-soft);
      margin-bottom: 20px;
    }
    .hero-info .meta {

      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 6px;
      font-size: 13px;

    .hero-info .desc {

      color: var(--text-sub);

      flex-wrap: wrap;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 14px;

      font-weight: 700;

      border-bottom: 1px solid var(--border-card);

    .doc-info p {

    // 初始化页面
    function initPage() {
      const activity = activities[activityId];
      if (!activity) {
        document.title = '活动未找到 · 水韵农青';
        return;
      }

      // 更新页面标题
      document.title = activity.title + ' · 水韵农青';
      document.getElementById('breadcrumbTitle').textContent = activity.title;
      document.getElementById('heroTitle').textContent = activity.title;
      document.getElementById('heroSubtitle').textContent = activity.subtitle;
      document.getElementById('heroDesc').textContent = activity.desc;
      document.getElementById('heroCover').src = activity.cover;

      // 更新元数据
      const metaHtml = `
        <span class="meta-tag">${activity.age}</span>
        <span class="meta-tag">${activity.type}</span>
      `;
      document.getElementById('heroMeta').innerHTML = metaHtml;

      // 更新策划书内容
      document.getElementById('planContent').innerHTML = `<p>${activity.plan}</p>`;

      // 更新照片画廊
      const photoHtml = activity.photos.map(photo => `
        <div class="gallery-item">
          <img src="${photo}" alt="活动照片">
        </div>
      `).join('');
      document.getElementById('photoGallery').innerHTML = photoHtml;

      // 更新视频内容
      if (activity.videos.length > 0) {
        const videoHtml = activity.videos.map(video => `
          <div class="video-container">
            <video controls>
              <source src="${video}" type="video/mp4">
              您的浏览器不支持视频播放。
            </video>
          </div>
        `).join('');
        document.getElementById('videoContainer').innerHTML = videoHtml;
      } else {
        document.getElementById('videoContainer').innerHTML = `
          <div class="empty-state">
            <div class="icon">🎬</div>
            <h4>暂无视频</h4>
            <p>该活动暂未上传视频资料</p>
          </div>
        `;
      }

      // 更新通讯稿内容
      document.getElementById('newsContent').innerHTML = `<p>${activity.news}</p>`;
    }

    // 选项卡切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // 移除所有active类
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        // 添加active类
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // 初始化
    initPage();
  </script>
