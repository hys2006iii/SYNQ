<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志愿服务活动 · 水韵农青大学生科技志愿服务队</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23019aaa'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fbf7ef'%3E水%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-deep: #163737;
      --teal-mid: #1d4645;
      --teal-accent: #019aaa;
      --leaf: #4ade80;
      --leaf-soft: #86efac;
      --amber: #fbbf24;
      --seal: #b91c1c;
      --text-pure: #ffffff;
      --text-main: #f1f5f9;
      --text-sub: #cbd5e1;
      --text-dim: #94a3b8;
      --border-card: rgba(255, 255, 255, 0.15);
      --font-kai: "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
      --font-song: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      --dur: 260ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background: var(--teal-deep);
      line-height: 1.8;
      min-height: 100vh;
    }

    /* 顶部导航 */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(22, 53, 53, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
    }
    .nav-wrap {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-pure);
    }
    .brand img {
      height: 38px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
    .brand .word {
      font-family: var(--font-kai);
      font-size: 24px;
      letter-spacing: 0.12em;
    }
    .brand .word b {
      color: var(--leaf);
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-links a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all var(--dur) ease;
    }
    .nav-links a:hover {
      color: var(--text-pure);
      background: rgba(255, 255, 255, 0.1);
    }

    /* 主内容 */
    .main {
      padding-top: 64px;
      min-height: 100vh;
    }

    /* 页面头部 */
    .page-header {
      background: linear-gradient(135deg, var(--teal-mid) 0%, var(--teal-deep) 100%);
      padding: 48px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border-card);
    }
    .page-header h1 {
      font-family: var(--font-song);
      font-size: clamp(28px, 3vw, 36px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-pure);
      margin-bottom: 12px;
    }
    .page-header p {
      font-size: 16px;
      color: var(--text-sub);
      max-width: 600px;
      margin: 0 auto;
    }

    /* 搜索和筛选 */
    .filter-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-pure);
      font-size: 15px;
      font-family: var(--font-sans);
      outline: none;
      transition: all var(--dur) ease;
    }
    .search-input::placeholder {
      color: var(--text-dim);
    }
    .search-input:focus {
      border-color: var(--teal-accent);
      background: rgba(255, 255, 255, 0.15);
    }
    .search-btn {
      padding: 12px 24px;
      background: var(--teal-accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--dur) ease;
    }
    .search-btn:hover {
      background: #01bcc8;
    }

    /* 分类筛选 */
    .category-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      transition: all var(--dur) ease;
    }
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-pure);
    }
    .filter-btn.active {
      background: var(--teal-accent);
      border-color: var(--teal-accent);
      color: #fff;
    }

    /* 活动网格 */
    .activities-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* 活动卡片 */
    .activity-card {
      background: rgba(30, 71, 69, 0.72);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      overflow: hidden;
      transition: all var(--dur) ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .activity-card:hover {
      transform: translateY(-4px);
      border-color: rgba(74, 222, 128, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .activity-card .cover {
      aspect-ratio: 16/9;
      overflow: hidden;
    }
    .activity-card .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--dur) ease;
    }
    .activity-card:hover .cover img {
      transform: scale(1.05);
    }
    .activity-card .info {
      padding: 20px;
    }
    .activity-card .info h3 {
      font-family: var(--font-song);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-pure);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .activity-card .info .subtitle {
      font-size: 14px;
      color: var(--leaf-soft);
      margin-bottom: 12px;
    }
    .activity-card .info .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .activity-card .info .meta-tag {
      padding: 4px 10px;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 4px;
      font-size: 12px;
      color: var(--leaf-soft);
    }

    /* 空状态 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 24px;
      color: var(--text-dim);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .empty-state h4 {
      font-size: 18px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px;
    }

    /* 统计信息 */
    .stats {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 24px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .stats b {
      color: var(--leaf-soft);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .activities-grid {
        grid-template-columns: 1fr;
      }
      .search-box {
        flex-direction: column;
      }
      .page-header { padding: 32px 16px; }
      .page-header h1 { font-size: 24px; }
      .nav-wrap { padding: 0 16px; }
      .brand .word { font-size: 20px; }
      .activity-card { padding: 16px; }
      .activity-card h3 { font-size: 16px; }
    }
    @media (max-width: 480px) {
      .activity-card { padding: 14px; }
      .activity-card h3 { font-size: 15px; }
      .activity-card p { font-size: 13px; }
      .btn { font-size: 13px; padding: 8px 16px; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <nav class="nav-wrap">
      <a class="brand" href="../index.html">
        <img src="../logo-mark.png" alt="水韵农青">
        <span class="word">水韵<b>农</b>青</span>
      </a>
      <div class="nav-links">
        <a href="../index.html">返回首页</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <!-- 页面头部 -->
    <section class="page-header">
      <h1>志愿服务活动</h1>
      <p>水韵农青大学生科技志愿服务队开展的各项志愿服务活动详情</p>
    </section>

    <!-- 搜索和筛选 -->
    <section class="filter-section">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索活动名称或关键词...">
        <button class="search-btn" id="searchBtn">搜索</button>
      </div>

      <div class="category-filter" id="categoryFilter">
        <!-- 分类按钮将由 JavaScript 动态生成 -->
      </div>
    </section>

    <!-- 统计信息 -->
    <div class="stats" id="stats">
      共 <b>0</b> 个志愿服务活动
    </div>

    <!-- 活动网格 -->
    <div class="activities-grid" id="activitiesGrid">
      <!-- 活动卡片将通过JavaScript动态加载 -->
    </div>
  </main>

  <script src="../activities-data.js"></script>
  <script>
    let currentCategory = 'all';
    let searchKeyword = '';
    let chapterActivities = [];

    // 从数据 API 加载篇章活动并构建分类按钮
    function initData() {
      var all = WaterYouthData.getAll();
      chapterActivities = all.filter(function(a) { return a.type === 'chapter'; });
      buildCategoryButtons();
    }

    // 根据数据中的唯一分类动态生成筛选按钮
    function buildCategoryButtons() {
      var container = document.getElementById('categoryFilter');
      var categories = [];
      var seen = {};
      chapterActivities.forEach(function(a) {
        if (!seen[a.category]) {
          seen[a.category] = true;
          categories.push(a.category);
        }
      });

      var html = '<button class="filter-btn active" data-category="all">全部</button>';
      categories.forEach(function(cat) {
        html += '<button class="filter-btn" data-category="' + cat + '">' + cat + '</button>';
      });
      container.innerHTML = html;

      // 绑定按钮事件
      container.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          container.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderActivities();
        });
      });
    }

    // 渲染活动卡片
    function renderActivities() {
      var grid = document.getElementById('activitiesGrid');
      var stats = document.getElementById('stats');

      var filtered = chapterActivities;

      // 应用分类筛选
      if (currentCategory !== 'all') {
        filtered = filtered.filter(function(a) { return a.category === currentCategory; });
      }

      // 应用搜索筛选
      if (searchKeyword) {
        filtered = filtered.filter(function(a) {
          return (a.title && a.title.toLowerCase().indexOf(searchKeyword) !== -1) ||
            (a.subtitle && a.subtitle.toLowerCase().indexOf(searchKeyword) !== -1) ||
            (a.desc && a.desc.toLowerCase().indexOf(searchKeyword) !== -1) ||
            (a.targetAge && a.targetAge.toLowerCase().indexOf(searchKeyword) !== -1);
        });
      }

      // 更新统计信息
      stats.innerHTML = '共 <b>' + filtered.length + '</b> 个志愿服务活动';

      // 渲染卡片
      if (filtered.length === 0) {
        grid.innerHTML =
          '<div class="empty-state">' +
            '<div class="icon">🔍</div>' +
            '<h4>未找到匹配的活动</h4>' +
            '<p>请尝试其他关键词或分类</p>' +
          '</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(activity) {
        var cover = activity.cover ? '../' + activity.cover : '';
        return '<a class="activity-card" href="template.html?id=' + activity.id + '">' +
          '<div class="cover">' +
            '<img src="' + cover + '" alt="' + activity.title + '">' +
          '</div>' +
          '<div class="info">' +
            '<h3>' + activity.title + '</h3>' +
            '<div class="subtitle">' + (activity.subtitle || '') + '</div>' +
            '<div class="meta">' +
              '<span class="meta-tag">' + (activity.targetAge || '') + '</span>' +
              '<span class="meta-tag">' + (activity.category || '') + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
      }).join('');
    }

    // 搜索功能
    document.getElementById('searchBtn').addEventListener('click', function() {
      searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      renderActivities();
    });

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
        renderActivities();
      }
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      searchKeyword = e.target.value.trim().toLowerCase();
      renderActivities();
    });

    // 初始化
    initData();
    renderActivities();
  </script>
</body>
</html>
