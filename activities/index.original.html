<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动与课程总览 · 水韵农青大学生科技志愿服务队</title>
<meta name="description" content="水韵农青大学生科技志愿服务队全量服务活动与特色点单菜单总览。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23019aaa'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fbf7ef'%3E水%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   oklch(0.965 0.01 92);
  --paper-2: oklch(0.936 0.014 90);
  --white:   #ffffff;
  --ink:     oklch(0.29 0.03 255);
  --ink-2:   oklch(0.45 0.028 255);
  --ink-3:   oklch(0.58 0.02 255);
  --sea:     oklch(0.58 0.105 200);
  --sea-ink: oklch(0.42 0.09 205);
  --sea-dark:oklch(0.26 0.06 212);
  --mist:    oklch(0.905 0.032 195);
  --leaf:    oklch(0.54 0.11 148);
  --seal:    oklch(0.55 0.15 27);
  --line:    1px solid oklch(0.29 0.03 255 / 0.14);
  --radius:  8px;
  --shadow:  0 8px 24px oklch(0.2 0.03 240 / 0.06);
  --font-kai: "Ma Shan Zheng", "KaiTi", serif;
  --font-song:"Noto Serif SC", "Songti SC", serif;
  --font-sans:"Noto Sans SC", "PingFang SC", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans); background: var(--paper); color: var(--ink);
  line-height: 1.8; font-size: 15px; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; }

/* 顶栏 */
.hdr {
  background: oklch(0.965 0.01 92 / 0.94); backdrop-filter: blur(12px);
  border-bottom: var(--line); position: sticky; top: 0; z-index: 100;
}
.hdr-in {
  max-width: 1240px; margin: 0 auto; height: 72px; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 40px; }
.brand .word { font-family: var(--font-kai); font-size: 26px; color: var(--sea-ink); }
.brand .word b { color: var(--leaf); font-weight: 400; }
.nav-actions { display: flex; gap: 14px; }
.nav-btn {
  font-size: 14.5px; font-weight: 500; color: var(--sea-ink);
  padding: 7px 18px; border-radius: 6px; border: 1px solid oklch(0.58 0.105 200 / 0.4);
  background: #fff; transition: all .2s;
}
.nav-btn:hover { background: var(--mist); }
.nav-btn.primary { background: var(--sea-ink); color: #fff; border-color: var(--sea-ink); }

/* 主视觉 */
.hero {
  background: linear-gradient(175deg, var(--sea-dark) 0%, var(--sea-ink) 70%);
  color: #fff; padding: 56px 24px; text-align: center;
}
.hero-k { font-size: 13px; letter-spacing: 0.5em; color: oklch(0.9 0.06 170); margin-bottom: 12px; }
.hero-t { font-family: var(--font-kai); font-size: clamp(34px, 5.5vw, 50px); font-weight: 400; letter-spacing: 0.08em; }
.hero-sub { margin-top: 12px; font-size: 16px; color: oklch(0.93 0.03 190 / 0.9); letter-spacing: 0.12em; }

/* 主容器 */
.wrap { max-width: 1240px; margin: 0 auto; padding: 36px 32px 88px; }

/* 筛选与搜索栏 */
.filter-bar {
  background: #fff; border-radius: var(--radius); border: var(--line); box-shadow: var(--shadow);
  padding: 18px 24px; display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px; margin-bottom: 32px;
}
.tab-group { display: flex; gap: 10px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 18px; border-radius: 6px; font-size: 14px; font-weight: 500;
  background: var(--paper); color: var(--ink-2); transition: all .2s;
}
.tab-btn.active { background: var(--sea-ink); color: #fff; font-weight: 600; }
.search-box { display: flex; align-items: center; gap: 10px; }
.search-input {
  padding: 9px 16px; border-radius: 6px; border: var(--line); font-size: 14px;
  background: var(--paper); outline: none; width: 260px;
}
.search-input:focus { border-color: var(--sea); background: #fff; }

/* 活动卡片网格 */
.sec-head {
  font-family: var(--font-song); font-size: 22px; font-weight: 700;
  letter-spacing: 0.1em; color: var(--sea-ink); margin: 38px 0 18px;
  display: flex; align-items: center; gap: 14px;
}
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.act-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px;
}
.act-card {
  background: #fff; border-radius: var(--radius); border: var(--line);
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  transition: transform .25s, box-shadow .25s, border-color .25s;
}
.act-card:hover {
  transform: translateY(-4px); box-shadow: 0 14px 30px oklch(0.2 0.03 240 / 0.12);
  border-color: var(--sea);
}
.card-thumb {
  position: relative; aspect-ratio: 16/10; overflow: hidden; background: var(--paper-2);
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.act-card:hover .card-thumb img { transform: scale(1.06); }
.card-tag {
  position: absolute; top: 12px; left: 12px; font-size: 12px; padding: 3px 10px;
  border-radius: 4px; background: rgba(0,0,0,0.68); color: #fff; backdrop-filter: blur(4px);
}
.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-cat { font-size: 12.5px; font-weight: 600; color: var(--sea); letter-spacing: 0.1em; }
.card-title { font-size: 17px; font-weight: 700; color: var(--ink); margin: 6px 0 8px; line-height: 1.4; }
.card-sub { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin-bottom: 14px; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid oklch(0.29 0.03 255 / 0.08); padding-top: 12px; font-size: 13px; color: var(--ink-3);
}
.card-link { color: var(--sea-ink); font-weight: 600; }

@media (max-width: 600px) {
  .filter-bar { flex-direction: column; align-items: stretch; }
  .search-input { width: 100%; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="../index.html">
      <img src="../logo-mark.png" alt="水韵农青">
      <span class="word">水韵<b>农</b>青</span>
    </a>
    <div class="nav-actions">
      <a class="nav-btn" href="../index.html">← 返回官网首页</a>
      <a class="nav-btn primary" href="../index.html#menu">特色课程点单</a>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-k">水韵农青 · 全站活动大厅</p>
  <h1 class="hero-t">每一道「菜」，都有专属的独立网页</h1>
  <p class="hero-sub">点击任意卡片即可查看图文详情、实拍画廊、精彩视频与微信推文</p>
</section>

<div class="wrap">
  <!-- 筛选栏 -->
  <div class="filter-bar">
    <div class="tab-group" id="tabGroup">
      <button class="tab-btn active" data-filter="all" type="button">全部活动与课程 (<span id="countAll">0</span>)</button>
      <button class="tab-btn" data-filter="chapter" type="button">五大服务篇章 (<span id="countChap">0</span>)</button>
      <button class="tab-btn" data-filter="menu" type="button">特色点单菜单 (<span id="countMenu">0</span>)</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索活动 / 课程 / 标签...">
    </div>
  </div>

  <!-- 内容列表容器 -->
  <div id="gridContainer"></div>
</div>

<script src="../activities-data.js"></script>
<script>
(function () {
  'use strict';

  // 隐藏后台快捷键 Ctrl+Shift+A
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
      window.open('../admin.html', '_blank');
    }
  });

  var allActs = window.WaterYouthData ? window.WaterYouthData.getAll() : [];
  var currentFilter = 'all';

  function render() {
    var kw = document.getElementById('searchInput').value.trim().toLowerCase();
    var filtered = allActs.filter(function (a) {
      if (currentFilter !== 'all' && a.type !== currentFilter) return false;
      if (kw) {
        var str = (a.title + ' ' + (a.subtitle || '') + ' ' + (a.category || '') + ' ' + (a.desc || '')).toLowerCase();
        if (str.indexOf(kw) === -1) return false;
      }
      return true;
    });

    document.getElementById('countAll').textContent = allActs.length;
    document.getElementById('countChap').textContent = allActs.filter(function(x){ return x.type === 'chapter'; }).length;
    document.getElementById('countMenu').textContent = allActs.filter(function(x){ return x.type === 'menu'; }).length;

    var container = document.getElementById('gridContainer');
    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:60px; color:var(--ink-3);">未找到符合条件的活动</p>';
      return;
    }

    // 分类展示或整合展示
    container.innerHTML = '<div class="act-grid">' + filtered.map(function (a) {
      var coverSrc = a.cover ? ('../' + a.cover) : '../photos/IMG_5612.JPG';
      var photoCount = (a.photos && a.photos.length) || 0;
      var tweetCount = (a.tweets && a.tweets.length) || 0;

      var metaInfo = '';
      if (photoCount > 0 && tweetCount > 0) {
        metaInfo = '🖼 ' + photoCount + ' 照片 · 📰 ' + tweetCount + ' 报道';
      } else if (photoCount > 0) {
        metaInfo = '🖼 ' + photoCount + ' 张现场照片';
      } else if (tweetCount > 0) {
        metaInfo = '📰 ' + tweetCount + ' 篇官方报道';
      } else {
        metaInfo = '🎯 ' + (a.targetAge || '精品科普课程');
      }

      return '<a class="act-card" href="../activity.html?id=' + a.id + '">' +
        '<div class="card-thumb">' +
          '<img src="' + coverSrc + '" alt="' + a.title + '" loading="lazy">' +
          '<span class="card-tag">' + (a.type === 'chapter' ? '服务篇章' : '特色菜单') + '</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div>' +
            '<span class="card-cat">' + (a.category || '科普实践') + '</span>' +
            '<h3 class="card-title">' + a.title + '</h3>' +
            '<p class="card-sub">' + (a.subtitle || (a.desc ? a.desc.slice(0, 42) + '...' : '')) + '</p>' +
          '</div>' +
          '<div class="card-foot">' +
            '<span>' + metaInfo + '</span>' +
            '<span class="card-link">查看详情 →</span>' +
          '</div>' +
        '</div>' +
      '</a>';
    }).join('') + '</div>';
  }

  // 选项卡事件
  var tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentFilter = tab.getAttribute('data-filter');
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', render);

  render();
})();
</script>
</body>
</html>
