<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动与课程总览 · 水韵农青大学生科技志愿服务队</title>
<meta name="description" content="水韵农青大学生科技志愿服务队全量服务活动与特色点单菜单总览。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23019aaa'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fbf7ef'%3E水%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* 统一温润水墨水青色系 (Natural River Green) */
:root {
  --teal-deep:    #163737;
  --teal-mid:     #1d4645;
  --teal-card:    #245250;
  --teal-accent:  #019aaa;
  --leaf:         #4ade80;
  --leaf-soft:    #86efac;
  --amber:        #fbbf24;
  --seal:         #b91c1c;

  --text-pure:    #ffffff;
  --text-main:    #f1f5f9;
  --text-sub:     #cbd5e1;
  --text-dim:     #94a3b8;

  --border-card:  rgba(255, 255, 255, 0.14);
  --border-light: rgba(255, 255, 255, 0.22);
  --border-gold:  rgba(251, 191, 36, 0.4);

  --font-kai:  "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
  --font-song: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;

  --dur: 260ms;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(1, 154, 170, 0.28), transparent 70%),
    radial-gradient(900px 600px at 85% 85%, rgba(34, 197, 94, 0.22), transparent 70%),
    linear-gradient(170deg, #183d3c 0%, #1e4b49 50%, #153534 100%);
  color: var(--text-main);
  line-height: 1.8;
  font-size: 16px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; }

/* 顶栏 */
.hdr {
  background: rgba(22, 53, 53, 0.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 100;
}
.hdr-in {
  max-width: 1260px; margin: 0 auto; height: 68px; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 42px; width: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
.brand .word { font-family: var(--font-kai); font-size: 26px; color: var(--text-pure); }
.brand .word b { color: var(--leaf); font-weight: 400; }
.nav-actions { display: flex; gap: 14px; align-items: center; }
.nav-btn {
  font-size: 14.5px; font-weight: 500; color: var(--text-sub);
  padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border-light);
  background: rgba(255, 255, 255, 0.08); transition: all .2s;
}
.nav-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; border-color: #fff; }
.nav-btn.primary {
  background: var(--leaf); color: #0d2818; border-color: transparent; font-weight: 600;
}
.nav-btn.primary:hover { background: #22c55e; }

/* 主视觉 Hero 区域 */
.hero {
  background: rgba(18, 44, 43, 0.6);
  color: #fff; padding: 50px 24px 34px; text-align: center;
  border-bottom: 1px solid var(--border-card);
}
.hero-k { font-size: 13.5px; letter-spacing: 0.35em; color: var(--amber); margin-bottom: 10px; font-weight: 600; }
.hero-t {
  font-family: var(--font-kai); font-size: clamp(34px, 4.8vw, 50px); font-weight: 400; letter-spacing: 0.08em;
}
.hero-sub {
  margin-top: 10px; font-size: 16px; color: var(--text-sub); letter-spacing: 0.08em;
  max-width: 680px; margin-left: auto; margin-right: auto;
}

/* 主容器 */
.wrap { max-width: 1260px; margin: 0 auto; padding: 28px 24px 88px; }

/* 筛选与搜索栏 */
.filter-bar {
  background: rgba(30, 71, 69, 0.72); border-radius: 8px; border: 1px solid var(--border-card);
  padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
}
.tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
.tab-btn {
  padding: 7px 18px; border-radius: 4px; font-size: 14px; font-weight: 500;
  background: rgba(255, 255, 255, 0.08); color: var(--text-sub); border: 1px solid var(--border-card);
  transition: all .2s;
}
.tab-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
.tab-btn.active {
  background: var(--leaf); color: #092716; font-weight: 600; border-color: transparent;
}
.search-box { display: flex; align-items: center; gap: 10px; }
.search-input {
  padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border-light); font-size: 14.5px;
  background: rgba(20, 50, 49, 0.85); color: #fff; outline: none; width: 280px;
  transition: all .2s;
}
.search-input:focus { border-color: var(--teal-accent); }
.search-input::placeholder { color: var(--text-dim); }

/* 活动卡片网格 */
.act-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 20px;
}
.act-card {
  background: rgba(30, 71, 69, 0.7); border-radius: 8px; border: 1px solid var(--border-card);
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .25s, border-color .25s, background .25s;
}
.act-card:hover {
  transform: translateY(-4px); border-color: var(--teal-accent); background: rgba(36, 82, 80, 0.95);
}
.card-thumb {
  position: relative; aspect-ratio: 16/10; overflow: hidden; background: #122828;
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-tag {
  position: absolute; top: 10px; left: 10px; font-size: 11.5px; padding: 2px 8px;
  border-radius: 3px; background: rgba(16, 40, 40, 0.9); color: #fde047;
  font-weight: 600; border: 1px solid rgba(255,255,255,0.15);
}
.card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-cat { font-size: 12.5px; font-weight: 600; color: var(--leaf-soft); letter-spacing: 0.1em; }
.card-title { font-size: 17.5px; font-weight: 700; color: #fff; margin: 5px 0 7px; line-height: 1.4; }
.card-sub { font-size: 13.5px; color: var(--text-sub); line-height: 1.6; margin-bottom: 12px; }
.card-foot {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border-card); padding-top: 10px; font-size: 13px; color: var(--text-dim);
}
.card-link { color: var(--leaf-soft); font-weight: 600; }

.hall-footer {
  text-align: center; padding: 36px 0 16px; color: var(--text-dim); font-size: 13px;
  border-top: 1px solid var(--border-card); margin-top: 50px;
}
.hall-footer .motto { color: #fde047; font-family: var(--font-song); margin-bottom: 6px; font-size: 14px; }

/* 主题活动列表 */
.chapter-list { display: flex; flex-direction: column; gap: 24px; }
.chapter-card {
  background: rgba(30, 71, 69, 0.7); border-radius: 12px; border: 1px solid var(--border-card);
  overflow: hidden; transition: border-color .25s;
}
.chapter-card:hover { border-color: var(--teal-accent); }
.chapter-header {
  display: flex; gap: 20px; padding: 20px; text-decoration: none; color: inherit;
  transition: background .2s;
}
.chapter-header:hover { background: rgba(255,255,255,0.03); }
.chapter-cover {
  width: 200px; height: 140px; border-radius: 8px; overflow: hidden; flex-shrink: 0; position: relative;
}
.chapter-cover img { width: 100%; height: 100%; object-fit: cover; }
.chapter-badge {
  position: absolute; top: 8px; left: 8px; width: 32px; height: 32px; border-radius: 6px;
  background: var(--leaf); color: #0d2818; font-family: var(--font-kai); font-size: 18px;
  display: flex; align-items: center; justify-content: center; font-weight: bold;
}
.chapter-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.chapter-cat { font-size: 12.5px; font-weight: 600; color: var(--leaf-soft); letter-spacing: 0.1em; margin-bottom: 4px; }
.chapter-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; line-height: 1.4; }
.chapter-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 10px; line-height: 1.6; }
.chapter-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-dim); }
.chapter-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-top: 1px solid var(--border-card); cursor: pointer;
  font-size: 13.5px; color: var(--leaf-soft); font-weight: 500; transition: background .2s;
}
.chapter-toggle:hover { background: rgba(255,255,255,0.05); }
.toggle-icon { font-size: 10px; }
.menu-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
  padding: 16px 20px 20px; border-top: 1px solid var(--border-card);
  background: rgba(22, 53, 53, 0.5);
}
.menu-card {
  background: rgba(30, 71, 69, 0.8); border-radius: 8px; border: 1px solid var(--border-card);
  overflow: hidden; text-decoration: none; color: inherit; transition: all .2s;
}
.menu-card:hover { transform: translateY(-3px); border-color: var(--teal-accent); background: rgba(36, 82, 80, 0.95); }
.menu-thumb { position: relative; aspect-ratio: 16/10; overflow: hidden; }
.menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
.menu-vid-badge {
  position: absolute; bottom: 6px; right: 6px; width: 24px; height: 24px; border-radius: 4px;
  background: rgba(0,0,0,0.8); color: #fde047; font-size: 11px;
  display: flex; align-items: center; justify-content: center; border: 1px solid rgba(251,191,36,0.5);
}
.menu-body { padding: 12px 14px; }
.menu-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; line-height: 1.4; }
.menu-sub { font-size: 12.5px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.5; }
.menu-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }

@media (max-width: 700px) {
  .filter-bar { flex-direction: column; align-items: stretch; }
  .search-input { width: 100%; }
  .chapter-header { flex-direction: column; }
  .chapter-cover { width: 100%; height: 180px; }
  .menu-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="../index.before-fullpage.html">
      <img src="../logo-mark.png" alt="水韵农青">
      <span class="word">水韵<b>农</b>青</span>
    </a>
    <div class="nav-actions">
      <a class="nav-btn" href="../index.before-fullpage.html">← 返回官网首页</a>
      <a class="nav-btn primary" href="../index.before-fullpage.html#menu">特色课程点单</a>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-k">水韵农青 · 全站活动大厅</p>
  <h1 class="hero-t">每一道「菜」，都有专属的独立网页</h1>
  <p class="hero-sub">点击任意卡片即可查看图文详情、实拍画廊、精彩视频与微信推文报道</p>
</section>

<div class="wrap">
  <!-- 筛选栏 -->
  <div class="filter-bar">
    <div class="tab-group" id="tabGroup">
      <button class="tab-btn active" data-filter="all" type="button">全部活动与课程 (<span id="countAll">0</span>)</button>
      <button class="tab-btn" data-filter="chapter" type="button">五大服务篇章 (<span id="countChap">0</span>)</button>
      <button class="tab-btn" data-filter="menu" type="button">特色点单菜单 (<span id="countMenu">0</span>)</button>
      <button class="tab-btn" data-filter="video" type="button" style="color:#fde047; border-color:rgba(251,191,36,0.35);">🎬 含实拍视频 (<span id="countVideo">0</span>)</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索活动 / 课程 / 标签...">
    </div>
  </div>

  <!-- 内容列表容器 -->
  <div id="gridContainer"></div>

  <footer class="hall-footer">
    <div class="motto">胸怀青衿志 · 科普水韵行</div>
    <div>© 2026 「水韵农青」大学生科技志愿服务队 · 数字化志愿服务中枢</div>
  </footer>
</div>

<script src="../activities-data.js"></script>
<script>
(function () {
  'use strict';

  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
      window.open('../admin.html', '_blank');
    }
  });

  var allActs = window.WaterYouthData ? window.WaterYouthData.getAll() : [];
  var chapters = allActs.filter(function(a) { return a.type === 'chapter'; });
  var menus = allActs.filter(function(a) { return a.type === 'menu'; });

  var chapterCategoryMap = {
    '壹': '科创农野',
    '贰': '水润江河',
    '叁': '趣玩实验',
    '肆': '绿色未来',
    '伍': '烟火城乡'
  };

  function getMenusForChapter(chapter) {
    var categoryNo = chapter.categoryNo;
    var menuCategory = chapterCategoryMap[categoryNo];
    return menus.filter(function(m) { return m.category === menuCategory; });
  }

  function hasVideo(a) {
    return !!(a.video && (a.video.url || a.video.embed));
  }

  var expandedChapters = {};

  function toggleChapter(chapterId) {
    expandedChapters[chapterId] = !expandedChapters[chapterId];
    render();
  }

  function render() {
    var kw = document.getElementById('searchInput').value.trim().toLowerCase();
    var container = document.getElementById('gridContainer');

    var filteredChapters = chapters;
    if (kw) {
      filteredChapters = chapters.filter(function(a) {
        var str = (a.title + ' ' + (a.subtitle || '') + ' ' + (a.category || '') + ' ' + (a.desc || '')).toLowerCase();
        if (str.indexOf(kw) !== -1) return true;
        var chapterMenus = getMenusForChapter(a);
        return chapterMenus.some(function(m) {
          var mStr = (m.title + ' ' + (m.subtitle || '') + ' ' + (m.category || '') + ' ' + (m.desc || '')).toLowerCase();
          return mStr.indexOf(kw) !== -1;
        });
      });
    }

    document.getElementById('countAll').textContent = chapters.length;
    document.getElementById('countChap').textContent = chapters.length;
    document.getElementById('countMenu').textContent = menus.length;
    document.getElementById('countVideo').textContent = allActs.filter(hasVideo).length;

    if (filteredChapters.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:60px; color:var(--text-dim); font-size:16px;">未找到符合条件的活动</p>';
      return;
    }

    var html = '<div class="chapter-list">';
    filteredChapters.forEach(function(chapter) {
      var coverSrc = chapter.cover ? ('../' + chapter.cover) : '../photos/IMG_5612.JPG';
      var chapterMenus = getMenusForChapter(chapter);
      var isExpanded = expandedChapters[chapter.id];

      var filteredMenus = chapterMenus;
      if (kw) {
        filteredMenus = chapterMenus.filter(function(m) {
          var mStr = (m.title + ' ' + (m.subtitle || '') + ' ' + (m.category || '') + ' ' + (m.desc || '')).toLowerCase();
          return mStr.indexOf(kw) !== -1;
        });
      }

      html += '<div class="chapter-card">';
      html += '<a class="chapter-header" href="../activity.html?id=' + chapter.id + '">';
      html += '<div class="chapter-cover">';
      html += '<img src="' + coverSrc + '" alt="' + chapter.title + '" loading="lazy">';
      html += '<span class="chapter-badge">' + chapter.categoryNo + '</span>';
      html += '</div>';
      html += '<div class="chapter-info">';
      html += '<span class="chapter-cat">' + (chapter.category || '科普实践') + '</span>';
      html += '<h3 class="chapter-title">' + chapter.title + '</h3>';
      html += '<p class="chapter-sub">' + (chapter.subtitle || '') + '</p>';
      html += '<div class="chapter-meta">';
      html += '<span>📋 ' + chapterMenus.length + ' 门课程</span>';
      html += '<span>🎯 ' + (chapter.targetAge || '全龄') + '</span>';
      html += '</div>';
      html += '</div>';
      html += '</a>';

      if (chapterMenus.length > 0) {
        html += '<div class="chapter-toggle" onclick="toggleChapter(\'' + chapter.id + '\')">';
        html += '<span>' + (isExpanded ? '收起课程' : '展开全部 ' + chapterMenus.length + ' 门课程') + '</span>';
        html += '<span class="toggle-icon">' + (isExpanded ? '▲' : '▼') + '</span>';
        html += '</div>';

        if (isExpanded && filteredMenus.length > 0) {
          html += '<div class="menu-grid">';
          filteredMenus.forEach(function(menu) {
            var menuCover = menu.cover ? ('../' + menu.cover) : '../photos/IMG_5612.JPG';
            var withVid = hasVideo(menu);
            var photoCount = (menu.photos && menu.photos.length) || 0;

            html += '<a class="menu-card" href="../activity.html?id=' + menu.id + '">';
            html += '<div class="menu-thumb">';
            html += '<img src="' + menuCover + '" alt="' + menu.title + '" loading="lazy">';
            if (withVid) html += '<span class="menu-vid-badge">▶</span>';
            html += '</div>';
            html += '<div class="menu-body">';
            html += '<h4 class="menu-title">' + menu.title + '</h4>';
            html += '<p class="menu-sub">' + (menu.subtitle || '') + '</p>';
            html += '<div class="menu-foot">';
            html += '<span>' + (menu.targetAge || '') + '</span>';
            if (photoCount > 0) html += '<span>🖼 ' + photoCount + '</span>';
            html += '</div>';
            html += '</div>';
            html += '</a>';
          });
          html += '</div>';
        } else if (isExpanded && filteredMenus.length === 0 && kw) {
          html += '<p style="padding:16px 20px; color:var(--text-dim); font-size:14px;">该主题下无匹配课程</p>';
        }
      }

      html += '</div>';
    });
    html += '</div>';

    container.innerHTML = html;
  }

  window.toggleChapter = toggleChapter;

  var tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var filter = tab.getAttribute('data-filter');
      if (filter === 'all' || filter === 'chapter') {
        render();
      }
    });
  });

  document.getElementById('searchInput').addEventListener('input', render);

  render();
})();
</script>
</body>
</html>
