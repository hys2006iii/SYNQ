<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动大厅 · 水韵农青大学生科技志愿服务队</title>
<meta name="description" content="水韵农青大学生科技志愿服务队全部志愿服务活动资料总览。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23019aaa'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fbf7ef'%3E水%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal-deep:    #163737;
  --teal-mid:     #1d4645;
  --teal-card:    #245250;
  --teal-accent:  #019aaa;
  --leaf:         #4ade80;
  --leaf-soft:    #86efac;
  --amber:        #fbbf24;
  --seal:         #b91c1c;
  --text-pure:    #ffffff;
  --text-main:    #f1f5f9;
  --text-sub:     #cbd5e1;
  --text-dim:     #94a3b8;
  --border-card:  rgba(255, 255, 255, 0.14);
  --border-light: rgba(255, 255, 255, 0.22);
  --font-kai:  "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
  --font-song: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --dur: 260ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(1, 154, 170, 0.28), transparent 70%),
    radial-gradient(900px 600px at 85% 85%, rgba(34, 197, 94, 0.22), transparent 70%),
    linear-gradient(170deg, #183d3c 0%, #1e4b49 50%, #153534 100%);
  color: var(--text-main);
  line-height: 1.8;
  font-size: 16px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.hdr {
  background: rgba(22, 53, 53, 0.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 100;
}
.hdr-in {
  max-width: 1260px; margin: 0 auto; height: 68px; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 42px; width: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
.brand .word { font-family: var(--font-kai); font-size: 26px; color: var(--text-pure); }
.brand .word b { color: var(--leaf); font-weight: 400; }
.nav-actions { display: flex; gap: 14px; align-items: center; }
.nav-btn {
  font-size: 14.5px; font-weight: 500; color: var(--text-sub);
  padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border-light);
  background: rgba(255, 255, 255, 0.08); transition: all .2s;
}
.nav-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; border-color: #fff; }
.nav-btn.primary {
  background: var(--leaf); color: #0d2818; border-color: transparent; font-weight: 600;
}
.nav-btn.primary:hover { background: #22c55e; }

.hero {
  background: rgba(18, 44, 43, 0.6);
  color: #fff; padding: 50px 24px 34px; text-align: center;
  border-bottom: 1px solid var(--border-card);
}
.hero-k { font-size: 13.5px; letter-spacing: 0.35em; color: var(--amber); margin-bottom: 10px; font-weight: 600; }
.hero-t {
  font-family: var(--font-kai); font-size: clamp(34px, 4.8vw, 50px); font-weight: 400; letter-spacing: 0.08em;
}
.hero-sub {
  margin-top: 10px; font-size: 16px; color: var(--text-sub); letter-spacing: 0.08em;
  max-width: 680px; margin-left: auto; margin-right: auto;
}

.wrap { max-width: 1260px; margin: 0 auto; padding: 28px 24px 88px; }

.filter-bar {
  background: rgba(30, 71, 69, 0.72); border-radius: 8px; border: 1px solid var(--border-card);
  padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
}
.tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
.tab-btn {
  padding: 7px 18px; border-radius: 4px; font-size: 14px; font-weight: 500;
  background: rgba(255, 255, 255, 0.08); color: var(--text-sub); border: 1px solid var(--border-card);
  transition: all .2s;
}
.tab-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
.tab-btn.active {
  background: var(--leaf); color: #092716; font-weight: 600; border-color: transparent;
}
.search-box { display: flex; align-items: center; gap: 10px; }
.search-input {
  padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border-light); font-size: 14.5px;
  background: rgba(20, 50, 49, 0.85); color: #fff; outline: none; width: 280px;
  transition: all .2s;
}
.search-input:focus { border-color: var(--teal-accent); }
.search-input::placeholder { color: var(--text-dim); }

.theme-list { display: flex; flex-direction: column; gap: 20px; }
.theme-card {
  background: rgba(30, 71, 69, 0.7); border-radius: 12px; border: 1px solid var(--border-card);
  overflow: hidden; transition: border-color .25s;
}
.theme-card:hover { border-color: var(--teal-accent); }
.theme-header {
  display: flex; align-items: center; gap: 16px; padding: 18px 20px;
  cursor: pointer; transition: background .2s;
}
.theme-header:hover { background: rgba(255,255,255,0.03); }
.theme-num {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  background: var(--leaf); color: #0d2818;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-kai); font-size: 18px; font-weight: bold;
}
.theme-info { flex: 1; }
.theme-title { font-size: 18px; font-weight: 700; color: #fff; }
.theme-meta { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.theme-toggle {
  font-size: 13px; color: var(--leaf-soft); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.theme-toggle .arrow { font-size: 10px; transition: transform .2s; }
.theme-card.open .theme-toggle .arrow { transform: rotate(180deg); }

.material-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
  padding: 0 20px 20px; border-top: 1px solid var(--border-card);
  background: rgba(22, 53, 53, 0.5);
}
.material-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 8px;
  background: rgba(30, 71, 69, 0.8); border: 1px solid var(--border-card);
  font-size: 13.5px; color: var(--text-sub); transition: all .2s;
}
.material-item:hover { border-color: var(--teal-accent); background: rgba(36, 82, 80, 0.95); }
.material-icon { font-size: 20px; flex-shrink: 0; }
.material-name { flex: 1; word-break: break-all; line-height: 1.4; }
.material-type { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

.hall-footer {
  text-align: center; padding: 36px 0 16px; color: var(--text-dim); font-size: 13px;
  border-top: 1px solid var(--border-card); margin-top: 50px;
}
.hall-footer .motto { color: #fde047; font-family: var(--font-song); margin-bottom: 6px; font-size: 14px; }

@media (max-width: 700px) {
  .filter-bar { flex-direction: column; align-items: stretch; }
  .search-input { width: 100%; }
  .material-grid { grid-template-columns: 1fr; }
  .hdr-in { padding: 0 16px; height: 56px; }
  .brand .word { font-size: 20px; }
  .hero-k { font-size: 12px; }
  .hero-title { font-size: clamp(28px, 8vw, 48px); }
  .hero-slogan { font-size: clamp(14px, 3.5vw, 20px); }
  .hero-actions { flex-direction: column; }
  .hero-actions a { width: 100%; text-align: center; }
  .section-title { font-size: 22px; }
  .group-title { font-size: 18px; }
  .material-card { padding: 16px; }
  .material-card h3 { font-size: 16px; }
  .hall-footer { padding: 16px; text-align: center; }
}
@media (max-width: 380px) {
  .hero-title { font-size: 28px; }
  .material-card { padding: 14px; }
  .material-card h3 { font-size: 15px; }
  .material-card p { font-size: 12px; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="../index.html">
      <img src="../logo-mark.png" alt="水韵农青">
      <span class="word">水韵<b>农</b>青</span>
    </a>
    <div class="nav-actions">
      <a class="nav-btn" href="../index.html">← 返回官网首页</a>
      <a class="nav-btn primary" href="../index.html#services">核心服务</a>
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-k">水韵农青 · 活动大厅</p>
  <h1 class="hero-t">志愿服务活动资料总览</h1>
  <p class="hero-sub">点击主题名称查看活动策划书、通讯稿、照片与视频等完整资料</p>
</section>

<div class="wrap">
  <div class="filter-bar">
    <div class="tab-group" id="tabGroup">
      <button class="tab-btn active" data-filter="all" type="button">全部主题 (<span id="countAll">0</span>)</button>
      <button class="tab-btn" data-filter="has-file" type="button">有资料 (<span id="countFile">0</span>)</button>
      <button class="tab-btn" data-filter="empty" type="button">待补充 (<span id="countEmpty">0</span>)</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索活动主题...">
    </div>
  </div>

  <div class="theme-list" id="themeList"></div>

  <footer class="hall-footer">
    <div class="motto">胸怀青衿志 · 科普水韵行</div>
    <div>© 2026 「水韵农青」大学生科技志愿服务队 · 数字化志愿服务中枢</div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var themes = [
    { id: 'soil-doctor', name: '土壤医生', materials: [] },
    { id: 'carbon-trace', name: '碳迹迷踪', materials: [
      { name: '低碳.docx', type: '策划书' },
      { name: '低碳.pdf', type: '策划书' }
    ]},
    { id: 'plant-stamp', name: '植物拓印', materials: [
      { name: '"寻觅自然疗愈，倾听生命脉络"植物拓印研学营活动策划书.docx', type: '策划书' },
      { name: '10.5古林公园志愿活动报销汇总表.xlsx', type: '报销' }
    ]},
    { id: 'soaring-wings', name: '翱翔之翼', materials: [
      { name: '6.8水火箭（修改简介）.docx', type: '策划书' },
      { name: '翱翔之翼，飞young想象(诺改).pptx', type: 'PPT' },
      { name: '主持稿子和加扣分机制.doc', type: '主持稿' },
      { name: '"翱翔之翼，飞Young想象"航天科普活动策划书.docx', type: '策划书' },
      { name: '活动背景.docx', type: '资料' },
      { name: '活动前期.docx', type: '资料' },
      { name: '意义.docx', type: '资料' }
    ]},
    { id: 'garden-adventure', name: '菜园奇遇记', materials: [
      { name: '"菜园奇遇记：探秘现代农场，解锁农耕智慧"三农科普活动策划书.docx', type: '策划书' },
      { name: '5G智慧农业.mp4', type: '视频' },
      { name: '菜园奇遇记.pdf', type: '资料' },
      { name: '菜园奇遇记.pptx', type: 'PPT' }
    ]},
    { id: 'great-water', name: '大国水利', materials: [
      { name: '大国水利.docx', type: '策划书' },
      { name: '航天科普.jpeg', type: '照片' },
      { name: '航天科普2.jpeg', type: '照片' },
      { name: '金陵水系—教案.doc', type: '教案' },
      { name: '金陵水系.pptx', type: 'PPT' }
    ]},
    { id: 'straw-rebirth', name: '废弃农作固体物焕新生', materials: [
      { name: '"废弃农作固体物\'焕新生\'"三农科普活动策划书.docx', type: '策划书' },
      { name: '活动预告.txt', type: '资料' },
      { name: '主持人稿.docx', type: '主持稿' },
      { name: '废弃农作固体焕新生.pptx', type: 'PPT' },
      { name: '水稻的生长.mp4', type: '视频' },
      { name: '3.9通讯稿.docx', type: '通讯稿' },
      { name: '4.4通讯稿.docx', type: '通讯稿' },
      { name: '秸秆变形记：稻草人冒险闯关嘉年华.docx', type: '策划书' },
      { name: '"秸"构奥秘·稻乡守望者 科学探究与三农实践工坊.docx', type: '策划书' }
    ]},
    { id: 'kindergarten', name: '河海大学幼儿园', materials: [
      { name: '适合大班小朋友独立完成.docx', type: '策划书' }
    ]},
    { id: 'physics-experiment', name: '科普实验', materials: [
      { name: '物理实验.docx', type: '策划书' },
      { name: '物理实验.pdf', type: '策划书' }
    ]},
    { id: 'pi-shihang', name: '淠史杭第二次志愿活动', materials: [
      { name: '《佛子岭大学》历史剧剧本.docx', type: '剧本' },
      { name: '活动预算表.xlsx', type: '预算' },
      { name: '历史情境剧.zip', type: '资料' },
      { name: '马原剧本（未修改版）.docx', type: '剧本' },
      { name: '淠史杭精神讲座ppt.pptx', type: 'PPT' },
      { name: '淠史杭宣讲稿子（前半段）.docx', type: '宣讲稿' }
    ]},
    { id: 'seedling-market', name: '青苗当家', materials: [
      { name: '"菜摊管家·农产品流通研学营"活动策划书.docx', type: '策划书' },
      { name: '活动预告.txt', type: '资料' },
      { name: '青苗当家.pdf', type: '资料' },
      { name: '青苗当家.pptx', type: 'PPT' },
      { name: '选蔬菜.mp4', type: '视频' },
      { name: 'VID_20250703_133134.mp4', type: '视频' }
    ]},
    { id: 'rice-creative', name: '水稻创意指尖生趣', materials: [
      { name: '活动预算表.xlsx', type: '预算' },
      { name: '3月16日水稻创意活动发票.zip', type: '发票' },
      { name: '活动策划案.docx', type: '策划书' },
      { name: '活动ppt.pptx', type: 'PPT' },
      { name: '活动通讯稿.docx', type: '通讯稿' }
    ]},
    { id: 'water-youth', name: '水韵农青', materials: [
      { name: '水韵农青.docx', type: '策划书' },
      { name: '预防踩踏.jpeg', type: '照片' },
      { name: '预防踩踏2.jpeg', type: '照片' }
    ]},
    { id: 'inch-green', name: '咫尺青绿', materials: [
      { name: '"咫尺青绿—清源讲堂"赴金陵图书馆科普团申报书.docx', type: '申报书' },
      { name: '微塑料污染.pptx', type: 'PPT' },
      { name: '咫尺青绿——清源讲堂答辩稿.docx', type: '答辩稿' }
    ]},
    { id: 'them-and-us', name: '它们与他们', materials: [] },
    { id: 'water-week', name: '中国水周策划书', materials: [] },
    { id: 'other-activities', name: '菜单外的其他活动', materials: [] },
    { id: '2024-showcase', name: '2024年风采展', materials: [] }
  ];

  var currentFilter = 'all';
  var expandedThemes = {};

  function getFileIcon(name) {
    var ext = name.split('.').pop().toLowerCase();
    var map = {
      'docx': '📝', 'doc': '📝', 'pptx': '📊', 'pdf': '📕',
      'xlsx': '📋', 'mp4': '🎬', 'jpeg': '🖼', 'jpg': '🖼',
      'png': '🖼', 'zip': '📦', 'txt': '📄'
    };
    return map[ext] || '📄';
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(String(s===null||s===undefined?'':s)));
    return d.innerHTML;
  }

  function render() {
    var kw = document.getElementById('searchInput').value.trim().toLowerCase();
    var list = document.getElementById('themeList');

    var filtered = themes;
    if (kw) {
      filtered = themes.filter(function(t) {
        return t.name.toLowerCase().indexOf(kw) !== -1 ||
          t.materials.some(function(m) { return m.name.toLowerCase().indexOf(kw) !== -1; });
      });
    }

    if (currentFilter === 'has-file') {
      filtered = filtered.filter(function(t) { return t.materials.length > 0; });
    } else if (currentFilter === 'empty') {
      filtered = filtered.filter(function(t) { return t.materials.length === 0; });
    }

    var hasFileCount = themes.filter(function(t) { return t.materials.length > 0; }).length;
    var emptyCount = themes.filter(function(t) { return t.materials.length === 0; }).length;
    document.getElementById('countAll').textContent = themes.length;
    document.getElementById('countFile').textContent = hasFileCount;
    document.getElementById('countEmpty').textContent = emptyCount;

    if (filtered.length === 0) {
      list.innerHTML = '<p style="text-align:center; padding:60px; color:var(--text-dim); font-size:16px;">未找到匹配的主题</p>';
      return;
    }

    var html = '';
    filtered.forEach(function(theme) {
      var isOpen = expandedThemes[theme.id];
      var matCount = theme.materials.length;
      // 使用原始索引作为编号，避免搜索后编号跳动
      var origNum = themes.indexOf(theme) + 1;

      html += '<div class="theme-card' + (isOpen ? ' open' : '') + '">';
      html += '<div class="theme-header" onclick="toggleTheme(\'' + escHtml(theme.id) + '\')">';
      html += '<span class="theme-num">' + origNum + '</span>';
      html += '<div class="theme-info">';
      html += '<div class="theme-title">' + escHtml(theme.name) + '</div>';
      html += '<div class="theme-meta">' + (matCount > 0 ? matCount + ' 份资料' : '暂无资料，待补充') + '</div>';
      html += '</div>';
      if (matCount > 0) {
        html += '<span class="theme-toggle"><span>展开</span><span class="arrow">▼</span></span>';
      }
      html += '</div>';

      if (matCount > 0 && isOpen) {
        html += '<div class="material-grid">';
        theme.materials.forEach(function(m) {
          html += '<div class="material-item">';
          html += '<span class="material-icon">' + getFileIcon(m.name) + '</span>';
          html += '<span class="material-name">' + escHtml(m.name) + '</span>';
          html += '<span class="material-type">' + escHtml(m.type) + '</span>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '</div>';
    });

    list.innerHTML = html;
  }

  window.toggleTheme = function(id) {
    expandedThemes[id] = !expandedThemes[id];
    render();
  };

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', render);

  render();
})();
</script>
</body>
</html>
