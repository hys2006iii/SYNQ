      height: 64px;

      align-items: center;
      justify-content: space-between;

      letter-spacing: 0.12em;
    }

    .nav-links {

      gap: 16px;

      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all var(--dur) ease;
    }
    .nav-links a:hover {

      background: rgba(255, 255, 255, 0.1);

      border-radius: 8px;
      font-size: 15px;

      }

      // 更新统计信息
      stats.innerHTML = `共 <b>${filtered.length}</b> 个志愿服务活动`;

      // 渲染卡片
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h4>未找到匹配的活动</h4>
            <p>请尝试其他关键词或分类</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(activity => `
        <a class="activity-card" href="template.html?id=${activity.id}">
          <div class="cover">
            <img src="${activity.cover}" alt="${activity.title}">
          </div>
          <div class="info">
            <h3>${activity.title}</h3>
            <div class="subtitle">${activity.subtitle}</div>
            <div class="meta">
              <span class="meta-tag">${activity.age}</span>
              <span class="meta-tag">${activity.category}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // 搜索功能
    document.getElementById('searchBtn').addEventListener('click', () => {
      searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      renderActivities();
    });

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
        renderActivities();
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchKeyword = e.target.value.trim().toLowerCase();
      renderActivities();
    });

    // 分类筛选
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderActivities();
      });
    });

    // 初始化
    renderActivities();
  </script>
</body>
</html>
