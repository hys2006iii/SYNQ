<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动详情 · 水韵农青大学生科技志愿服务队</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23019aaa'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%23fbf7ef'%3E水%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-deep: #163737;
      --teal-mid: #1d4645;
      --teal-accent: #019aaa;
      --leaf: #4ade80;
      --leaf-soft: #86efac;
      --amber: #fbbf24;
      --seal: #b91c1c;
      --text-pure: #ffffff;
      --text-main: #f1f5f9;
      --text-sub: #cbd5e1;
      --text-dim: #94a3b8;
      --border-card: rgba(255, 255, 255, 0.15);
      --font-kai: "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
      --font-song: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, serif;
      --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      --dur: 260ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background: var(--teal-deep);
      line-height: 1.8;
      min-height: 100vh;
    }

    /* 顶部导航 */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(22, 53, 53, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
    }
    .nav-wrap {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-pure);
    }
    .brand img {
      height: 38px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
    .brand .word {
      font-family: var(--font-kai);
      font-size: 24px;
      letter-spacing: 0.12em;
    }
    .brand .word b {
      color: var(--leaf);
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-links a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all var(--dur) ease;
    }
    .nav-links a:hover {
      color: var(--text-pure);
      background: rgba(255, 255, 255, 0.1);
    }

    /* 主内容 */
    .main {
      padding-top: 64px;
      min-height: 100vh;
    }

    /* 面包屑 */
    .breadcrumb {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .breadcrumb a {
      color: var(--teal-accent);
      text-decoration: none;
    }
    .breadcrumb a:hover {
      text-decoration: underline;
    }

    /* 活动头部 */
    .hero {
      background: linear-gradient(135deg, var(--teal-mid) 0%, var(--teal-deep) 100%);
      padding: 48px 24px;
      border-bottom: 1px solid var(--border-card);
    }
    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }
    .hero-info h1 {
      font-family: var(--font-song);
      font-size: clamp(28px, 3vw, 36px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-pure);
      margin-bottom: 16px;
    }
    .hero-info .subtitle {
      font-size: 16px;
      color: var(--leaf-soft);
      margin-bottom: 20px;
    }
    .hero-info .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .meta-tag {
      padding: 6px 14px;
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 6px;
      font-size: 13px;
      color: var(--leaf-soft);
    }
    .hero-info .desc {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.8;
    }
    .hero-cover {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .hero-cover img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    /* 内容区域 */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    /* 选项卡导航 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-card);
      padding-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--dur) ease;
    }
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-pure);
    }
    .tab-btn.active {
      background: var(--teal-accent);
      border-color: var(--teal-accent);
      color: #fff;
    }

    /* 选项卡内容 */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 卡片样式 */
    .card {
      background: rgba(30, 71, 69, 0.72);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h3 {
      font-family: var(--font-song);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-pure);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-card);
    }

    /* 文档列表 */
    .doc-list {
      display: grid;
      gap: 12px;
    }
    .doc-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: all var(--dur) ease;
    }
    .doc-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--teal-accent);
    }
    .doc-icon {
      width: 40px;
      height: 40px;
      background: var(--teal-accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .doc-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-pure);
      margin-bottom: 2px;
    }
    .doc-info p {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* 图片画廊 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .gallery-item {
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      transition: transform var(--dur) ease;
    }
    .gallery-item:hover {
      transform: scale(1.02);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 视频区域 */
    .video-container {
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
      margin-bottom: 16px;
    }
    .video-container video {
      width: 100%;
      height: 100%;
    }
    .video-info {
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .video-info h4 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-pure);
      margin-bottom: 8px;
    }
    .video-info p {
      font-size: 14px;
      color: var(--text-sub);
    }

    /* 返回按钮 */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
      transition: all var(--dur) ease;
      margin-bottom: 24px;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-pure);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-dim);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .empty-state h4 {
      font-size: 18px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px;
    }

    /* 教学流程时间线 */
    .timeline-item {
      position: relative; padding: 16px 0 16px 28px;
      border-bottom: 1px solid var(--border-card);
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-item::before {
      content: ''; position: absolute; left: 0; top: 22px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--teal-accent); border: 2px solid var(--teal-mid);
    }
    .timeline-item h4 {
      font-size: 15px; font-weight: 600; color: var(--text-pure); margin-bottom: 4px;
    }
    .timeline-item p { font-size: 14px; color: var(--text-sub); line-height: 1.6; }
    .timeline-item .step {
      display: inline-block; padding: 2px 8px; background: var(--teal-accent);
      color: #fff; border-radius: 4px; font-size: 11px; font-weight: 600;
      margin-bottom: 6px;
    }

    /* 物料清单 */
    .material-list {
      list-style: none; padding: 0; margin: 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
    }
    .material-list li {
      padding: 10px 16px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-card); border-radius: 6px;
      font-size: 14px; color: var(--text-sub);
    }

    /* 通讯稿卡片 */
    .tweet-card {
      padding: 16px; margin-bottom: 16px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-card);
      border-radius: 8px; transition: all var(--dur) ease;
    }
    .tweet-card:last-child { margin-bottom: 0; }
    .tweet-card:hover { border-color: var(--teal-accent); }
    .tweet-card h4 { font-size: 15px; font-weight: 600; color: var(--text-pure); margin-bottom: 6px; }
    .tweet-card .tweet-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .tweet-card .tweet-meta span { margin-right: 16px; }
    .tweet-card p { font-size: 14px; color: var(--text-sub); line-height: 1.7; }
    .tweet-card .tweet-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
    .tweet-card a { color: var(--teal-accent); text-decoration: underline; font-size: 13px; }

    /* 高亮标签 */
    .highlights { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .highlight-tag {
      padding: 4px 12px; background: rgba(1,154,170,0.2); border: 1px solid rgba(1,154,170,0.3);
      border-radius: 4px; font-size: 12px; color: var(--leaf-soft);
    }
    .stats-text { margin-top: 16px; font-size: 14px; color: var(--amber); font-weight: 600; }

    /* 响应式 */
    @media (max-width: 768px) {
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .tabs {
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .tab-btn {
        white-space: nowrap;
      }
      .page-header { padding: 32px 16px; }
      .page-header h1 { font-size: 24px; }
      .nav-wrap { padding: 0 16px; }
      .brand .word { font-size: 20px; }
      .hero-title { font-size: clamp(24px, 6vw, 36px); }
      .hero-subtitle { font-size: 14px; }
      .info-grid { grid-template-columns: 1fr; }
      .info-card { padding: 16px; }
      .section-title { font-size: 20px; }
      .timeline-item { padding-left: 24px; }
    }
    @media (max-width: 480px) {
      .hero-title { font-size: 22px; }
      .info-card { padding: 14px; }
      .info-card h3 { font-size: 15px; }
      .info-card p { font-size: 13px; }
      .btn { font-size: 13px; padding: 8px 16px; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <nav class="nav-wrap">
      <a class="brand" href="../index.html">
        <img src="../logo-mark.png" alt="水韵农青">
        <span class="word">水韵<b>农</b>青</span>
      </a>
      <div class="nav-links">
        <a href="../index.html">返回首页</a>
        <a href="index.html">活动总览</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <!-- 面包屑 -->
    <div class="breadcrumb">
      <a href="../index.html">首页</a> / 
      <a href="index.html">志愿服务活动</a> / 
      <span id="breadcrumbTitle">活动详情</span>
    </div>

    <!-- 活动头部 -->
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-info">
          <h1 id="heroTitle">活动标题</h1>
          <p class="subtitle" id="heroSubtitle">活动副标题</p>
          <div class="meta" id="heroMeta">
            <span class="meta-tag">适合年龄</span>
            <span class="meta-tag">活动类型</span>
          </div>
          <p class="desc" id="heroDesc">活动描述</p>
        </div>
        <div class="hero-cover">
          <img id="heroCover" src="../photos/IMG_5612.JPG" alt="活动封面">
        </div>
      </div>
    </section>

    <!-- 内容区域 -->
    <div class="content">
      <a class="back-btn" href="index.html">← 返回活动列表</a>

      <!-- 选项卡导航 — 由 JS 动态生成 -->
      <div class="tabs"></div>

      <!-- 活动概览（原策划书 Tab） -->
      <div class="tab-content active" id="tab-plan">
        <div class="card">
          <h3>📋 活动概览</h3>
          <div id="planContent"></div>
        </div>
      </div>

      <!-- 照片内容 -->
      <div class="tab-content" id="tab-photos">
        <div class="card">
          <h3>📸 活动照片</h3>
          <div class="gallery" id="photoGallery"></div>
        </div>
      </div>

      <!-- 视频内容 -->
      <div class="tab-content" id="tab-video">
        <div class="card">
          <h3>🎬 活动视频</h3>
          <div id="videoContainer"></div>
        </div>
      </div>

      <!-- 通讯稿内容 -->
      <div class="tab-content" id="tab-tweets">
        <div class="card">
          <h3>📰 活动通讯</h3>
          <div id="tweetsContent"></div>
        </div>
      </div>

      <!-- 教学流程 -->
      <div class="tab-content" id="tab-curriculum">
        <div class="card">
          <h3>📋 教学流程</h3>
          <div id="curriculumContent"></div>
        </div>
      </div>

      <!-- 物料清单 -->
      <div class="tab-content" id="tab-materials">
        <div class="card">
          <h3>📦 物料清单</h3>
          <div id="materialsContent"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../activities-data.js"></script>
  <script>
    (function () {
      var urlParams = new URLSearchParams(window.location.search);
      var activityId = urlParams.get('id');
      var activity = null;
      var visibleSections = null;

      function escHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text || ''));
        return div.innerHTML;
      }

      function isEmpty(arr) { return !arr || !Array.isArray(arr) || arr.length === 0; }

      function fixPath(p) {
        if (!p) return p;
        return p.replace(/^((?!\/|https?:\/\/|data:).*)$/, '../$1');
      }

      function renderTabs() {
        var tabsWrap = document.querySelector('.tabs');
        if (!tabsWrap) return;
        var visible = visibleSections || {};
        var sections = [];
        if (visible.photos !== false) sections.push({ id: 'tab-photos', label: '📸 活动照片' });
        if (visible.video !== false) sections.push({ id: 'tab-video', label: '🎬 活动视频' });
        if (visible.tweets !== false) sections.push({ id: 'tab-tweets', label: '📰 活动通讯' });
        if (visible.curriculum !== false) sections.push({ id: 'tab-curriculum', label: '📋 教学流程' });
        if (activity.materials && activity.materials.length > 0) sections.push({ id: 'tab-materials', label: '📦 物料清单' });

        tabsWrap.innerHTML = '';
        if (isEmpty(sections)) {
          tabsWrap.style.display = 'none';
          return;
        }
        tabsWrap.style.display = '';
        sections.forEach(function (s, i) {
          var btn = document.createElement('button');
          btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
          btn.textContent = s.label;
          btn.dataset.tab = s.id;
          tabsWrap.appendChild(btn);
        });

        var planTab = document.getElementById('tab-plan');
        if (planTab) planTab.classList.remove('active');
        var firstContent = document.getElementById(sections[0].id);
        if (firstContent) firstContent.classList.add('active');
      }

      function renderHero() {
        document.title = (activity.title || '') + ' · 水韵农青';
        var bt = document.getElementById('breadcrumbTitle');
        if (bt) bt.textContent = activity.title || '活动详情';
        var ht = document.getElementById('heroTitle');
        if (ht) ht.textContent = activity.title || '';
        var hs = document.getElementById('heroSubtitle');
        if (hs) hs.textContent = activity.subtitle || '';
        var hd = document.getElementById('heroDesc');
        if (hd) hd.textContent = activity.desc || '';
        var hc = document.getElementById('heroCover');
        if (hc && activity.cover) hc.src = fixPath(activity.cover);

        var meta = document.getElementById('heroMeta');
        if (meta) {
          meta.innerHTML = '';
          if (activity.targetAge) {
            var s = document.createElement('span');
            s.className = 'meta-tag';
            s.textContent = activity.targetAge;
            meta.appendChild(s);
          }
          if (activity.category) {
            var s2 = document.createElement('span');
            s2.className = 'meta-tag';
            s2.textContent = activity.category;
            meta.appendChild(s2);
          }
        }
      }

      function renderPhotos() {
        var gallery = document.getElementById('photoGallery');
        if (!gallery) return;
        if (isEmpty(activity.photos)) {
          gallery.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无活动照片</p>';
          return;
        }
        gallery.innerHTML = '';
        activity.photos.forEach(function (p) {
          var item = document.createElement('div');
          item.className = 'gallery-item';
          var img = document.createElement('img');
          img.src = fixPath(p.url);
          img.alt = p.title || '';
          img.loading = 'lazy';
          item.appendChild(img);

          if (p.title || p.desc) {
            var cap = document.createElement('div');
            cap.style.cssText = 'padding:8px 4px;font-size:13px;color:var(--text-sub);text-align:center;';
            var parts = [];
            if (p.title) parts.push(escHtml(p.title));
            if (p.desc) parts.push(escHtml(p.desc));
            cap.textContent = parts.join(' — ');
            item.appendChild(cap);
          }
          gallery.appendChild(item);
        });
      }

      function renderVideos() {
        var container = document.getElementById('videoContainer');
        if (!container) return;
        var v = activity.video;
        if (!v || (!v.url && !v.embed)) {
          container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无视频资料' + (v && v.tip ? ' · ' + escHtml(v.tip) : '') + '</p>';
          return;
        }
        var html = '';
        if (v.embed) {
          html += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin-bottom:12px;"><iframe src="' + escHtml(v.embed) + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>';
        }
        if (v.url) {
          html += '<div style="border-radius:8px;overflow:hidden;margin-bottom:12px;"><video controls style="width:100%;display:block;"><source src="' + escHtml(fixPath(v.url)) + '" type="video/mp4">您的浏览器不支持视频播放。</video></div>';
        }
        if (v.tip) {
          html += '<p style="font-size:13px;color:var(--text-dim);margin-top:8px;">💡 ' + escHtml(v.tip) + '</p>';
        }
        container.innerHTML = html;
      }

      function renderTweets() {
        var container = document.getElementById('tweetsContent');
        if (!container) return;
        if (isEmpty(activity.tweets)) {
          container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无通讯稿</p>';
          return;
        }
        container.innerHTML = '';
        activity.tweets.forEach(function (t) {
          var card = document.createElement('div');
          card.className = 'tweet-card';
          var inner = '';
          if (t.cover) inner += '<img class="tweet-cover" src="' + escHtml(fixPath(t.cover)) + '" alt="" loading="lazy">';
          inner += '<h4>' + escHtml(t.title) + '</h4>';
          var metaParts = [];
          if (t.platform) metaParts.push(t.platform);
          if (t.date) metaParts.push(t.date);
          if (metaParts.length) {
            inner += '<div class="tweet-meta">' + metaParts.map(function (m) { return '<span>' + escHtml(m) + '</span>'; }).join('') + '</div>';
          }
          if (t.summary) inner += '<p>' + escHtml(t.summary) + '</p>';
          if (t.url) inner += '<a href="' + escHtml(t.url) + '" target="_blank" rel="noopener">阅读全文 →</a>';
          card.innerHTML = inner;
          container.appendChild(card);
        });
      }

      function renderCurriculum() {
        var container = document.getElementById('curriculumContent');
        if (!container) return;
        if (isEmpty(activity.curriculum)) {
          container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无教学流程</p>';
          return;
        }
        container.innerHTML = '';
        activity.curriculum.forEach(function (c) {
          var item = document.createElement('div');
          item.className = 'timeline-item';
          var html = '';
          if (c.step) html += '<span class="step">Step ' + escHtml(c.step) + '</span>';
          if (c.title) html += '<h4>' + escHtml(c.title) + '</h4>';
          if (c.content) html += '<p>' + escHtml(c.content) + '</p>';
          item.innerHTML = html;
          container.appendChild(item);
        });
      }

      function renderMaterials() {
        var container = document.getElementById('materialsContent');
        if (!container) return;
        if (isEmpty(activity.materials)) {
          container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无物料清单</p>';
          return;
        }
        container.innerHTML = '';
        var list = document.createElement('ul');
        list.className = 'material-list';
        activity.materials.forEach(function (m) {
          var li = document.createElement('li');
          li.textContent = m;
          list.appendChild(li);
        });
        container.appendChild(list);
      }

      function renderPlan() {
        var container = document.getElementById('planContent');
        if (!container) return;
        var parts = [];
        if (activity.stats) parts.push(activity.stats);
        if (activity.highlights && activity.highlights.length > 0) {
          parts.push('亮点：' + activity.highlights.join(' · '));
        }
        if (parts.length > 0) {
          container.innerHTML = '';
          parts.forEach(function (p) {
            var para = document.createElement('p');
            para.textContent = p;
            container.appendChild(para);
          });
        } else {
          container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:32px 0;">暂无策划信息</p>';
        }
      }

      function setupTabs() {
        var tabsWrap = document.querySelector('.tabs');
        if (!tabsWrap) return;
        tabsWrap.addEventListener('click', function (e) {
          var btn = e.target.closest('.tab-btn');
          if (!btn) return;
          tabsWrap.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
          document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
          btn.classList.add('active');
          var target = document.getElementById(btn.dataset.tab);
          if (target) target.classList.add('active');
        });
      }

      function init() {
        if (!activityId) {
          document.getElementById('heroTitle').textContent = '参数错误';
          document.getElementById('heroDesc').textContent = '缺少活动 ID 参数，请使用 ?id=xxx 访问。';
          return;
        }
        activity = WaterYouthData.getById(activityId);
        if (!activity) {
          document.title = '活动未找到 · 水韵农青';
          document.getElementById('heroTitle').textContent = '活动未找到';
          document.getElementById('heroDesc').textContent = 'ID「' + escHtml(activityId) + '」对应的活动不存在。';
          return;
        }
        visibleSections = activity.visibleSections || { photos: true, video: true, tweets: true, curriculum: true };
        renderHero();
        renderTabs();
        renderPlan();
        renderPhotos();
        renderVideos();
        renderTweets();
        renderCurriculum();
        renderMaterials();
        setupTabs();
      }

      init();
    })();
  </script>
</body>
</html>
